name: Build Location Spoofer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Repository contents:"
          ls -lah

          echo "Checking ZIP:"
          test -f LocationSpoofer_FLAT_ANDROID_V2.zip

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q LocationSpoofer_FLAT_ANDROID_V2.zip -d project

          echo "Extracted project:"
          find project -maxdepth 6 -type f | sort

          echo "Checking Android project:"
          test -f project/build.gradle.kts
          test -f project/settings.gradle.kts
          test -f project/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
